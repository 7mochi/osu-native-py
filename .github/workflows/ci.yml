name: "Build, Test and Publish"

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            lib_name: osu.Native.dll
          - os: macos-latest
            platform: osx-arm64
            lib_name: osu.Native.dylib
          - os: ubuntu-latest
            platform: linux-x64
            lib_name: osu.Native.so
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            lib_name: osu.Native.so
          - os: ubuntu-latest
            platform: linux-arm
            lib_name: osu.Native.so

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('osu-native/**/*.csproj') }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install dependencies
        run: python -m pip install build hatchling ctypesgen jinja2 twine

      - name: Install cross-compile toolchain
        if: ${{ matrix.platform == 'linux-arm' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf lld

      - name: Build osu-native
        if: ${{ matrix.platform != 'linux-arm' }}
        run: dotnet publish osu-native/osu.Native -c Release -r ${{ matrix.platform }} -o build/generated -p:IlcGenerateMstatFile=false -p:IlcGenerateDgmlFile=false

      - name: Build osu-native (cross-compile)
        if: ${{ matrix.platform == 'linux-arm' }}
        run: dotnet publish osu-native/osu.Native -c Release -r ${{ matrix.platform }} -o build/generated -p:LinkerFlavor=lld -p:StripSymbols=false -p:IlcGenerateMstatFile=false -p:IlcGenerateDgmlFile=false

      - name: Export upstream test cases
        if: ${{ matrix.platform == 'linux-x64' }}
        run: dotnet run --project osu-native/osu.Native.Tests -c Release -- build/generated

      - name: Upload upstream test cases
        if: ${{ matrix.platform == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-cases
          path: |
            build/generated/difficulty.json
            build/generated/timed-difficulty.json
            build/generated/performance.json
          if-no-files-found: error
          retention-days: 1

      - name: Generate Python bindings
        run: python scripts/generate_bindings.py --publish build/generated

      - name: Organize native library
        run: |
          mkdir -p src/osu_native_py/native/bin/${{ matrix.platform }}
          mv build/generated/${{ matrix.lib_name }} src/osu_native_py/native/bin/${{ matrix.platform }}/

      - name: Build wheel
        run: python tools/build_all_wheels.py

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.10'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.11'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.12'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.13'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.14'
            wheel-platform: linux-x64
          - os: ubuntu-24.04-arm
            python-version: '3.10'
            wheel-platform: linux-arm64
          - os: ubuntu-24.04-arm
            python-version: '3.13'
            wheel-platform: linux-arm64
          - os: windows-latest
            python-version: '3.13'
            wheel-platform: win-x64
          - os: macos-latest
            python-version: '3.13'
            wheel-platform: osx-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.wheel-platform }}
          path: dist/

      - name: Download upstream test cases
        uses: actions/download-artifact@v8
        with:
          name: test-cases
          path: build/generated

      - name: Install wheel and dependencies
        shell: bash
        run: |
          python -m pip install pytest pytest-cov
          python -m pip install --no-cache-dir dist/*.whl

      - name: Run tests
        run: python -m pytest tests/ -v

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: "startsWith(github.event.head_commit.message, 'chore: publish library to pypi')"
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
