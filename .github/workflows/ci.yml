name: "Build, Test and Publish"

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  build-native:
    name: Build native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            lib_name: osu.Native.dll
          - os: macos-latest
            platform: osx-arm64
            lib_name: osu.Native.dylib
          - os: ubuntu-latest
            platform: linux-x64
            lib_name: osu.Native.so
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            lib_name: osu.Native.so
          - os: ubuntu-latest
            platform: linux-arm
            lib_name: osu.Native.so

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install cross-compile toolchain
        if: ${{ matrix.platform == 'linux-arm' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf lld

      - name: Build osu-native
        if: ${{ matrix.platform != 'linux-arm' }}
        run: dotnet publish osu-native/osu.Native -c Release -r ${{ matrix.platform }} -o build/generated

      - name: Build osu-native (cross-compile)
        if: ${{ matrix.platform == 'linux-arm' }}
        run: dotnet publish osu-native/osu.Native -c Release -r ${{ matrix.platform }} -o build/generated -p:LinkerFlavor=lld -p:StripSymbols=false

      - name: Fix cabinet header
        run: python scripts/fix_cabinet_header.py

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            build/generated/${{ matrix.lib_name }}
            build/generated/cabinet.h

  build-wheel:
    name: Build Python wheel (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
          - platform: osx-arm64
          - platform: linux-x64
          - platform: linux-arm64
          - platform: linux-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling ctypesgen twine

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/native-${{ matrix.platform }}

      - name: Organize native library
        shell: bash
        run: |
          mkdir -p src/osu_native_py/native/bin/${{ matrix.platform }}
          mkdir -p build/generated

          if [ "${{ matrix.platform }}" = "win-x64" ]; then
            cp artifacts/native-win-x64/osu.Native.dll src/osu_native_py/native/bin/win-x64/
          elif [ "${{ matrix.platform }}" = "osx-arm64" ]; then
            cp artifacts/native-osx-arm64/osu.Native.dylib src/osu_native_py/native/bin/osx-arm64/
          elif [ "${{ matrix.platform }}" = "linux-arm64" ]; then
            cp artifacts/native-linux-arm64/osu.Native.so src/osu_native_py/native/bin/linux-arm64/
          elif [ "${{ matrix.platform }}" = "linux-arm" ]; then
            cp artifacts/native-linux-arm/osu.Native.so src/osu_native_py/native/bin/linux-arm/
          else
            cp artifacts/native-linux-x64/osu.Native.so src/osu_native_py/native/bin/linux-x64/
          fi

          cp artifacts/native-${{ matrix.platform }}/cabinet.h build/generated/

      - name: Generate Python bindings
        run: |
          ctypesgen build/generated/cabinet.h \
            -l osu.Native \
            -o src/osu_native_py/native/bindings.py \
            -D "bool=char" \
            --allow-gnu-c \
            --no-macro-warnings \
            --no-gnu-types

      - name: Patch bindings for multi-platform support
        shell: bash
        run: |
          sed -i.bak 's|add_library_search_dirs(\[\])|import os, platform, sys; from pathlib import Path; _m = platform.machine(); _bin_dir = Path(__file__).parent / "bin" / ("win-x64" if sys.platform == "win32" else "osx-arm64" if sys.platform == "darwin" else "linux-arm64" if _m == "aarch64" else "linux-arm" if _m.startswith("arm") else "linux-x64"); add_library_search_dirs([str(_bin_dir)])|' src/osu_native_py/native/bindings.py
          rm -f src/osu_native_py/native/bindings.py.bak

      - name: Build wheel
        run: python tools/build_all_wheels.py

      - name: Twine check
        run: twine check dist/*

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [build-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.10'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.11'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.12'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.13'
            wheel-platform: linux-x64
          - os: ubuntu-latest
            python-version: '3.14'
            wheel-platform: linux-x64
          - os: ubuntu-24.04-arm
            python-version: '3.10'
            wheel-platform: linux-arm64
          - os: ubuntu-24.04-arm
            python-version: '3.13'
            wheel-platform: linux-arm64
          - os: windows-latest
            python-version: '3.13'
            wheel-platform: win-x64
          - os: macos-latest
            python-version: '3.13'
            wheel-platform: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel-platform }}
          path: dist/

      - name: Install wheel and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip || true
          pip install pytest pytest-cov
          pip install dist/*.whl

      - name: Run tests
        run: python -m pytest tests/ -v

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheel, test]
    if: "startsWith(github.event.head_commit.message, 'chore: publish library to pypi')"
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
